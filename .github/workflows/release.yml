name: release

# The first releasable macOS build (spec §Build order M6): the bundled
# sidecar plus the Tauri app as a .dmg for aarch64-apple-darwin — the
# primary target, Robert's M-series Mac. Unsigned by default; codesigning
# and notarization turn themselves on only when the APPLE_* secrets exist
# (see desktop/README.md §Signing and notarization).
#
# workflow_dispatch builds and attaches the dmg as a run artifact; a v*
# tag additionally publishes a GitHub Release with the dmg attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    # softprops/action-gh-release creates the GitHub Release and attaches
    # the dmg on a v* tag; the default GITHUB_TOKEN is read-only, which
    # failed the first tagged run with 403 "Resource not accessible by
    # integration". Job-scoped, so nothing else the workflow does needs it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Pass Apple secrets to the build when they exist
        # Tauri signs when APPLE_SIGNING_IDENTITY is set and notarizes
        # when APPLE_ID/APPLE_PASSWORD are set, so exporting only the
        # non-empty secrets is the whole gate.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              echo "$v=${!v}" >> "$GITHUB_ENV"
            fi
          done

      - name: Import the signing certificate for the widget
        if: env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build and sign the widget
        working-directory: desktop/macos-widget
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo 'a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  '"$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          xcodebuild -project RecapWidget.xcodeproj -scheme RecapWidget -configuration Release \
            -derivedDataPath build -arch arm64 CODE_SIGNING_ALLOWED=NO build
          codesign --force --sign "${APPLE_SIGNING_IDENTITY:--}" --options runtime \
            --entitlements RecapWidget.entitlements build/Build/Products/Release/RecapWidget.appex
          mkdir -p build/Release
          ditto build/Build/Products/Release/RecapWidget.appex build/Release/RecapWidget.appex
          xcrun swiftc -target arm64-apple-macos13.0 Reload/main.swift -o build/Release/recap-widget-reload
          codesign --force --sign "${APPLE_SIGNING_IDENTITY:--}" --options runtime build/Release/recap-widget-reload
          codesign --verify --strict --verbose=2 build/Release/RecapWidget.appex
          codesign --verify --strict --verbose=2 build/Release/recap-widget-reload

      - name: Build the app and its dmg
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm sidecar aarch64-apple-darwin
          pnpm tauri build --target aarch64-apple-darwin --config macos-widget/tauri.widget.conf.json

      - name: Verify the bundle's code signature
        # The bundle is ad-hoc signed by default (signingIdentity "-"),
        # so Gatekeeper offers the "unidentified developer → Open Anyway"
        # path instead of calling the app damaged. A broken seal — the
        # "damaged" case — must fail the job here, before anyone installs
        # it. spctl is informational: an ad-hoc build has no Apple
        # identity, so Gatekeeper will reject it; that's expected and
        # must not fail the run.
        working-directory: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: |
          test -d Recap.app/Contents/PlugIns/RecapWidget.appex
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Recap.app/Contents/PlugIns/RecapWidget.appex/Contents/Info.plist)" = com.madebywelch.recap.widget
          codesign --verify --strict --verbose=2 Recap.app/Contents/PlugIns/RecapWidget.appex
          codesign -d --entitlements :- Recap.app/Contents/PlugIns/RecapWidget.appex > "$RUNNER_TEMP/widget-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$RUNNER_TEMP/widget-entitlements.plist")" = true
          codesign --verify --strict --verbose=2 Recap.app/Contents/MacOS/recap-widget-reload
          codesign --verify --deep --strict --verbose=2 Recap.app
          spctl --assess --type execute -vv Recap.app || true

      - name: Upload the dmg as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: recap-macos-aarch64
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach the dmg to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
